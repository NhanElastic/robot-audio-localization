[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doa-localization"
version = "0.1.0"
description = "Direction of Arrival sound source localization"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pyroomacoustics",
]

[tool.setuptools.packages.find]
where = ["src"]
